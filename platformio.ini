[platformio]
; `pio test` runs Native Unity tests; no automatic ESP32 upload.
default_envs = native_tests

[env:sinric_lab]
platform = espressif32@6.13.0
board = esp32dev
framework = espidf
monitor_speed = 115200
check_tool = cppcheck
; Match detected physical flash (2 MB) and use single factory partition.
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
build_flags =
    -DFAN_DC_ONOFF=0
    -DRELAY_ACTIVE_LOW=1
test_ignore = *

[env:sinric_dc]
platform = espressif32@6.13.0
board = esp32dev
framework = espidf
monitor_speed = 115200
check_tool = cppcheck
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
build_flags =
    -DFAN_DC_ONOFF=1
    -DRELAY_ACTIVE_LOW=1
test_ignore = *

[env:native_tests]
platform = native
test_framework = unity
test_filter = test_fan_logic
test_build_src = no
